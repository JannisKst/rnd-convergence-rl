# Settings shared by every entry point. Experiment content lives in the configs that
# compose this one (train.yaml and the env/ group).
defaults:
  - _self_
  - override hydra/job_logging: colorlog
  - override hydra/hydra_logging: colorlog

hydra:
  job:
    chdir: true
  run:
    dir: logs/${now:%Y-%m-%d}/${now:%H-%M-%S}
  sweep:
    dir: logs/${now:%Y-%m-%d}/${now:%H-%M-%S}

seed: 0
