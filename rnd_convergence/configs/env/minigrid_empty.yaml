# Rung 2, easy variant: (x, y, dir), 3-D discrete, dense enough to converge.
#
# This rung's job is to supply a well-defined t_conv on a discrete state space, so the
# safest MiniGrid available is the right choice: Empty-5x5 has no key, no door and a
# reward the agent reaches by wandering. minigrid_doorkey5 is the alternative if the
# pilot shows Empty saturates too fast to resolve a plateau at all.
id: MiniGrid-Empty-5x5-v0
kwargs: {}

# 10 evaluation episodes, as on every other rung, and deliberately not more. Raising it to 20
# was tried here to tame `retained`, which comes out between -0.24 and 4.39 across seeds, and
# it changed nothing: with 20 episodes every value reproduced to six decimal places. The
# measurement that explains why is the within-evaluation standard deviation, which is zero at
# all 60 evaluation points --- Empty-5x5 starts the agent in a fixed cell and a greedy policy
# is deterministic, so twenty episodes are one episode run twenty times. There is no sampling
# noise here to average down.
#
# What is left is a property of the *policy*: between one evaluation and the next the greedy
# argmax either solves the maze or does not, so the curve is a 0.955/0.0 sequence in time and
# `retained` divides one two-valued number by a difference of two more. That makes `retained`
# uninterpretable on this rung rather than noisy, which is a finding to report, not a setting
# to spend evaluation episodes on.
total_steps: 300_000
eval_interval: 5_000
eval_episodes: 10
rollout_steps: 2_048

signal_window: 10_000
signal_stride: 5_000
